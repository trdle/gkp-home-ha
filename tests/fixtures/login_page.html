<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GKP Home - Login</title>
</head>
<body>
<div class="login-page">
  <div class="validation-summary-valid alert alert-danger" data-valmsg-summary="true"><ul><li style="display:none"></li></ul></div>
  <form method="post" action="/Account/Login?ReturnUrl=%2Fconnect%2Fauthorize%2Fcallback%3Fclient_id%3D835295d3-75c5-470c-82e1-9919f74c00c2">
    <input type="hidden" id="ReturnUrl" name="ReturnUrl" value="/connect/authorize/callback?client_id=835295d3-75c5-470c-82e1-9919f74c00c2" />
    <div class="form-group">
      <label for="Username">Username</label>
      <input class="form-control" placeholder="Username" autofocus type="text" id="Username" name="Username" value="" />
    </div>
    <div class="form-group">
      <label for="Password">Password</label>
      <input type="password" class="form-control" placeholder="Password" autocomplete="off" id="Password" name="Password" />
    </div>
    <div class="form-group login-remember">
      <label for="RememberLogin">
        <input type="checkbox" id="RememberLogin" name="RememberLogin" value="true" />
        <strong>Remember My Login</strong>
      </label>
    </div>
    <div class="form-group">
      <button class="btn btn-primary" name="button" value="login">Login</button>
      <button class="btn btn-secondary" name="button" value="cancel">Cancel</button>
    </div>
    <input name="__RequestVerificationToken" type="hidden" value="CfDJ8dummyAntiForgeryToken" />
    <input name="RememberLogin" type="hidden" value="false" />
  </form>
</div>
</body>
</html>
