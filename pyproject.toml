[project]
name = "gkp-home-ha"
version = "0.1.0"
description = "Home Assistant custom integration for GKP Home WiFi radiators"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "DTZ",    # flake8-datetimez
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "FLY",    # flynt
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "T20",    # flake8-print
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020
]
ignore = [
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "E501",    # line length is handled by the formatter
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
    "PLR2004", # magic value comparison
    "TRY003",  # long messages outside exception class
    "TRY300",  # consider moving statement to else block
    "RUF012",  # mutable class attributes (HA entity descriptions)
    "N818",    # exception names follow Home Assistant conventions (InvalidAuth, CannotConnect)
]

[tool.ruff.lint.per-file-ignores]
"custom_components/gkp_home/const.py" = [
    "S105",    # config key names and the app's built-in credentials
]
"tests/*" = [
    "S101",    # use of assert
    "S105",    # hardcoded password strings (dummy test values)
    "S106",    # hardcoded password arguments (dummy test values)
    "S107",    # hardcoded password defaults (dummy test values)
    "SLF001",  # private member access
    "PLR0915", # too many statements
    "D",       # docstrings are optional in tests
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.gkp_home", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".git", ".venv"]
